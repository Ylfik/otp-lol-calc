# Fabrique l'installeur Windows et le publie, sans machine ni commande.
#
# Déclenché par une étiquette de version :
#
#   git tag overlay-v0.1.0 && git push origin overlay-v0.1.0
#
# ou, depuis le site de GitHub : onglet Actions -> "Installeur Windows"
# -> "Run workflow". GitHub prête une machine Windows, construit le .exe
# et l'attache à une Release, dont le lien se donne à n'importe qui.

name: Installeur Windows

on:
  push:
    tags: ["overlay-v*"]
  workflow_dispatch:        # bouton manuel
    inputs:
      tag:
        description: "Étiquette à (re)remplir, ex. overlay-v0.2.0. Vide : on construit sans rien publier."
        required: false
        default: ""

permissions:
  contents: write           # nécessaire pour créer la Release

jobs:
  build:
    runs-on: windows-latest
    # l'app vit dans un sous-dossier : le site occupe la racine du depot
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier que rien n'est cassé
        run: npm test

      - name: Construire l'installeur
        run: npm run dist

      # Sans latest.yml, l'app installee ne sait pas se remplacer : elle
      # retombe sur un lien. Un build qui l'oublie doit echouer ici,
      # plutot que de produire un installeur silencieusement diminue.
      - name: Vérifier les fichiers de mise à jour
        shell: bash
        run: |
          ls -la release/
          test -f release/latest.yml || { echo "::error::latest.yml manquant"; exit 1; }
          ls release/*.exe >/dev/null || { echo "::error::aucun installeur"; exit 1; }
          ls release/*.blockmap >/dev/null || echo "::warning::pas de .blockmap"
          echo "version annoncee :"; grep '^version:' release/latest.yml

      # Garde le .exe même sans étiquette, pour un essai manuel
      - name: Conserver l'installeur
        uses: actions/upload-artifact@v4
        with:
          name: installeur-windows
          path: |
            app/release/*.exe
            app/release/latest.yml
          if-no-files-found: error

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # une Release creee a la main depuis le site de GitHub existe
          # deja quand ce job demarre : on y attache alors le fichier au
          # lieu d'echouer
          # latest.yml et le .blockmap sont ce que l'app lit pour se
          # mettre a jour toute seule : sans eux, elle retombe sur un
          # simple lien. Ils partent donc avec l'installeur.
          gh release create "${TAG}" \
            release/*.exe release/latest.yml release/*.blockmap \
            --title "LoL Overlay ${TAG}" \
            --notes "Minuteur d'objectifs et builds d'otp-lol-calc.

          Windows peut afficher « Windows a protégé votre ordinateur » :
          l'installeur n'est pas signé par un certificat payant. Cliquez
          sur « Informations complémentaires » puis « Exécuter quand
          même ». Jouez en mode **sans bordure**, aucune fenêtre ne
          s'affiche par-dessus un plein écran exclusif." \
            || gh release upload "${TAG}" \
                 release/*.exe release/latest.yml release/*.blockmap --clobber

          # GitHub renomme a l'envoi tout fichier dont le nom porte un
          # espace ; electron-updater, lui, cherche exactement le nom
          # ecrit dans latest.yml. Un reliquat sous un autre nom laisse
          # une Release qui a l'air complete et une app qui telecharge
          # dans le vide. On le retire.
          want=$(grep -m1 '^path:' release/latest.yml | sed 's/^path: *//' | tr -d '\r')
          echo "latest.yml annonce : $want"
          # « rien a nettoyer » est le cas normal, et grep sort alors en
          # erreur : sous set -o pipefail, ca ferait echouer une
          # publication parfaitement saine
          vieux=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" -q '.assets[].name' \
                  | grep -E '\.exe(\.blockmap)?$' | grep -vF "$want" || true)
          if [ -n "$vieux" ]; then
            printf '%s\n' "$vieux" | while read -r nom; do
              echo "retrait de l'asset « $nom »"
              gh release delete-asset "${TAG}" "$nom" -y
            done
          fi

          # et on verifie que ce que l'app ira chercher existe vraiment
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" -q '.assets[].name' \
            | grep -qxF "$want" \
            || { echo "::error::$want absent de la Release : la mise a jour automatique serait morte"; exit 1; }
          echo "ok : la Release contient bien $want"
