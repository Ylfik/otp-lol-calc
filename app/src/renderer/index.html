<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay</title>
<style>
  :root{
    --bg:rgba(10,14,20,.82); --line:rgba(255,255,255,.10);
    --ink:#e9eef6; --faint:#8b97a8;
    --soon:#f0b429; --up:#49d18a; --baron:#9b7bd4; --drake:#e0734a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none}
  #wrap{display:flex;flex-direction:column;gap:3px;padding:6px}

  /* deliberately small: this sits over the game all match long, so it
     has to be readable at a glance and forgettable the rest of the time */
  .card{
    background:var(--bg);border:1px solid var(--line);border-left-width:2px;
    border-radius:5px;padding:3px 7px;color:var(--ink);
    backdrop-filter:blur(7px);
    display:flex;align-items:baseline;gap:6px;
  }
  .card .name{font-size:11px;font-weight:600;letter-spacing:.01em;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .time{font-size:11px;font-variant-numeric:tabular-nums;color:var(--faint)}
  .card.up .time{color:var(--up);font-weight:600}
  .card.soon{border-left-color:var(--soon)}
  .card.up{border-left-color:var(--up)}
  .card[data-id="baron"]{border-left-color:var(--baron)}
  .card[data-id="dragon"],.card[data-id="elder"]{border-left-color:var(--drake)}

  /* the thirty second warning: bigger, and it leaves on its own */
  .alert{
    background:rgba(16,21,30,.93);border:1px solid var(--soon);
    border-radius:8px;padding:9px 12px;color:var(--ink);
    font-size:15px;font-weight:600;letter-spacing:.01em;
    box-shadow:0 6px 22px rgba(0,0,0,.45);
    animation:pop .22s ease-out;
  }
  .alert .who{display:block}
  .alert small{display:block;font-size:11px;font-weight:400;color:var(--soon);
    letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .fade{opacity:0;transition:opacity .4s ease}

  /* what the site advises for this champion */
  #guide{background:var(--bg);border:1px solid var(--line);border-left:2px solid #5b8dd6;
    border-radius:5px;padding:4px 7px;color:var(--ink);backdrop-filter:blur(7px);
    margin-top:3px}
  #guide .nxt{font-size:12px;font-weight:700;letter-spacing:.01em;display:flex;
    align-items:baseline;gap:6px}
  #guide .nxt b{color:#79a9f0;font-size:14px}
  #guide .who{font-size:9.5px;color:var(--faint);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #guide .path{font-size:9.5px;color:var(--faint);letter-spacing:.06em}
  #guide.none{display:none}

  #upd{background:rgba(16,21,30,.93);border:1px solid #5b8dd6;border-radius:5px;
    padding:4px 7px;color:var(--ink);font-size:10.5px;line-height:1.4;margin-top:3px}
  #upd b{color:#79a9f0}
  #upd.none{display:none}

  #status{font-size:9.5px;color:var(--faint);padding:1px 3px;letter-spacing:.03em}
  @media (prefers-reduced-motion:reduce){.alert{animation:none}.fade{transition:none}}
</style>
</head>
<body>
  <div id="wrap">
    <div id="list"></div>
    <div id="guide" class="none"></div>
    <div id="upd" class="none"></div>
    <div id="status">en attente d'une partie…</div>
  </div>
<script src="overlay.js" type="module"></script>
</body>
</html>
